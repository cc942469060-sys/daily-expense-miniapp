# Runs the unit tests and the structure check on every pull request and on pushes to main.
# The project has no npm dependencies, so there is no install step.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The tests mock Date with node:test, which needs Node.js 20.11 or newer.
          node-version: 22
      - run: npm test
      - run: npm run check
